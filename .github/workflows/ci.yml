name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up a PureScript toolchain
        uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "unstable"
          purs-tidy: "latest"

      - name: Cache PureScript dependencies
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.yaml', 'spago.lock', '.github/workflows/ci.yml') }}
          path: |
            .spago
            output

      - name: Install dependencies
        run: spago fetch

      - name: Build source
        run: spago build --strict --pedantic-packages

      - name: Check formatting
        run: purs-tidy check src test
